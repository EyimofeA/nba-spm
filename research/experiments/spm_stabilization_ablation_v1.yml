schema_version: experiment_preregistration_v1
experiment_id: spm_stabilization_ablation_v1
status: frozen_reused_diagnostic
created_at: 2026-08-27
estimand_id: prior_validation_suite_v1

question: >-
  Does same-season empirical-Bayes stabilization improve the frozen five-year
  SPM and its one-season RAPM posterior when the raw and stabilized arms use
  the same concepts, rows, learners, targets, and evaluation games?

information_cutoff:
  rating_seasons: [2021, 2022, 2023, 2024, 2025, 2026]
  evaluated_rating_seasons: [2021, 2022, 2023, 2024, 2025]
  final_unscored_rating_season: 2026
  test_seasons: [2022, 2023, 2024, 2025, 2026]
  training_rule: window_end strictly before rating_season
  season_2027: forbidden

feature_contract:
  common_features: >-
    Keep every frozen selected feature that has no declared raw/stabilized pair.
  offense_ratio_rule: >-
    Pair each selected offense field ending in _eb with its selected field of
    the same name without _eb. Remove the raw duplicate from the stabilized arm.
  offense_composite_pairs:
    shooting_proficiency_2017_eb: shooting_proficiency_2017
    box_creation_2017_eb_p100: box_creation_2017_p100
    offensive_load_2017_eb_p100: offensive_load_2017_p100
    assist_to_load_2017_eb: assist_to_load_2017
    turnover_to_load_2017_eb: turnover_to_load_2017
    creation_to_load_2017_eb: creation_to_load_2017
    behavioral_passer_score_v1: behavioral_passer_score_raw_v1
    crafted_spacing_stable_v1: crafted_spacing_proxy_v1
  defense_pairs:
    dfg_diff_pct_eb: dfg_diff_pct_raw
    rim_diff_pct_eb: rim_diff_pct_raw
    rim_points_saved_p100: rim_points_saved_p100_raw
    matchup_opponent_adjusted_points_saved_p100_eb: matchup_opponent_adjusted_points_saved_p100
    matchup_fga_suppressed_vs_scorer_p100_eb: matchup_fga_suppressed_vs_scorer_p100_raw
    matchup_shotmaking_points_saved_vs_scorer_p100_eb: matchup_shotmaking_points_saved_vs_scorer_p100_raw
    matchup_three_pa_suppressed_vs_scorer_p100_eb: matchup_three_pa_suppressed_vs_scorer_p100_raw
    matchup_turnovers_forced_vs_scorer_p100_eb: matchup_turnovers_forced_vs_scorer_p100_raw
    matchup_assists_suppressed_vs_scorer_p100_eb: matchup_assists_suppressed_vs_scorer_p100_raw
    matchup_shooting_fouls_prevented_vs_scorer_p100_eb: matchup_shooting_fouls_prevented_vs_scorer_p100_raw
  exclusions:
    - Do not include both values from one pair in either arm.
    - Do not change unrelated features between arms.
    - Do not use another season to stabilize or fill a feature value.

model_contract:
  target: zero-prior terminal-lineup RAPM over the same rolling five seasons
  offense_learner: frozen histogram gradient boosting
  defense_learner: frozen ridge
  sample_weight: square root of the smaller five-year offensive or defensive exposure
  net_identity: offense plus defense

aio_contract:
  likelihood_seasons: 1
  lambda_offense: 3000
  lambda_defense: 3000
  lambda_home: 300
  center_scale: 1
  lineup_policy: terminal

evaluation:
  primary: equal-season mean next-season whole-game margin MSE
  reported_scale: RMSE in final-margin points
  secondary:
    - next-season game-margin correlation
    - same-window five-year RAPM target RMSE and correlation
    - paired whole-game MSE interval
  identical_games: required within each test season
  uncertainty:
    draws: 5000
    unit: whole game within test season
    seed: 20260827

decision_rule: >-
  Prefer stabilization only if the stabilized AIO lowers paired next-season MSE
  against the raw AIO without a material correlation decline. Reused seasons
  cannot promote a public model.

stopping_rules:
  - Freeze the complete concept map before fitting.
  - Keep learners, targets, sample weights, and RAPM penalties fixed.
  - Do not subset-search feature pairs after seeing results.
  - Do not load or score Season 2027.
  - Build the 2026 rating, but do not score it against 2027.
  - Record a null or loss in the research log.
