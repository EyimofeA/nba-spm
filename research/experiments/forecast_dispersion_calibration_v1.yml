schema_version: experiment_preregistration_v1
experiment_id: forecast_dispersion_calibration_v1
status: preregistered
created_at: 2026-08-21
estimand_id: next_season_annual_impact_v1

hypothesis: >-
  The promoted backbone (predictive_backbone_combo_v1) is strongly
  under-dispersed against noisy next-season labels (the failure that blocked
  predictive_spm_v1 gate 3). Modeling forecast-error variance as an
  exposure-driven noise floor plus a constant model term, fit only on
  selection folds, produces calibrated per-player uncertainty intervals.

candidate_change: >-
  No point prediction changes. Add per-side predictive standard deviations:
  sd_i = sqrt(max(a_side + b_side / n_i, floor)), where n_i is the side's
  target-season possession count and (a_side, b_side) is fit once per side by
  weighted least squares of squared selection-fold residuals on 1/n.
  Net standard deviation combines sides as if independent:
  sd_net = sqrt(sd_off^2 + sd_def^2). Side forecasts are the frozen 50/50
  combination of predictive_spm_raw and state_space_filtered components.

data_contract:
  substrate: the promoted run from predictive_backbone_combo_v1 (scored_rows
  provides both components, targets, and possessions per identical row)
  forecast_seasons: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  parameter_fit_seasons: [2019, 2020, 2021, 2022, 2023, 2024] only
  primary_population: at least 1,000 possessions on both sides
  weighting: square root of the smaller target-season possession count
  variance_floor: 1e-6
  information_cutoff: parameters use selection folds only; confirmation rows
  are scored exactly once with the frozen parameters

evaluation:
  gates_on: confirmation seasons 2025 and 2026 pooled, primary population
  dispersion_gate: weighted RMSE divided by weighted mean sd within
    [0.85, 1.15] for offense, defense, and net
  coverage_gate: empirical 68 percent interval coverage within 0.05 of 0.683
    for offense, defense, and net
  diagnostics: per-season dispersion and coverage for 2019-2024, labeled
    in-sample because parameters saw those residuals

decision_rules:
  - PROMOTE intervals for publication iff all three dispersion gates and all
    three coverage gates pass on the confirmation seasons.
  - If any gate fails, record which side failed and stop; a new experiment id
    is required for any variance-model change.
  - Season 2027 stays reserved.

stopping_rules:
  - One parameter fit, no search over functional forms.
  - Confirmation seasons are touched exactly once.
