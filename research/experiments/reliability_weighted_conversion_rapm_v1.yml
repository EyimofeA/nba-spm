schema_version: experiment_preregistration_v1
experiment_id: reliability_weighted_conversion_rapm_v1
status: preregistered_reused_diagnostic
estimand_id: luck_adjusted_player_impact_v1
created_at: 2026-09-03

arms:
  - normal_realized_points
  - neutral_residual_25pct
  - neutral_residual_50pct
  - neutral_residual_75pct
  - preseason_skill_expected
  - history_reliability_hybrid

season_policy:
  rating_seasons: [2024, 2025]
  test_seasons: [2025, 2026]
  residual_weight_selection_season: 2025
  reused_diagnostic_season: 2026
  forbidden_season: 2027

conversion_source:
  run_id: luck_adjusted_rapm_v1_8580bb30e9
  neutral_expectation: player_neutral_location_clock_score_home_period
  shooter_skill: pre_season_empirical_bayes
  residual_retention_grid: [0.25, 0.50, 0.75]
  history_reliability: current_season_category_attempts_over_attempts_plus_preselected_prior_attempts

target:
  neutral_blend: neutral_expected_points_plus_weight_times_actual_minus_neutral_expected_points
  history_hybrid: preseason_skill_expected_points_plus_reliability_times_actual_minus_preseason_skill_expected_points
  nonconversion_points: observed

rapm:
  lambda_off: 3000.0
  lambda_def: 4500.0
  lambda_home: 300.0
  lineup_policy: terminal

evaluation:
  primary: next_season_game_margin_rmse
  supporting: [margin_correlation, calibration_slope, predicted_margin_sd, paired_whole_game_rmse_interval]
  identical_games: true
  bootstrap_draws: 5000

stopping_rules:
  - Select the neutral residual weight only from 2025 game RMSE.
  - Report the selected weight on reused 2026 games without redesign.
  - Treat every 2025 and 2026 result as reused diagnostic evidence.
  - Do not load Season 2027.
  - Do not publish or promote from this test.
