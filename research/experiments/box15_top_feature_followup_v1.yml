schema_version: experiment_preregistration_v1
experiment_id: box15_top_feature_followup_v1
status: frozen_reused_diagnostic
estimand_id: prior_validation_suite_v1

question: >-
  Do the strongest non-Box15 fields from the frozen chronological full-SPM
  permutation audit improve the Box15 prior after the same RAPM update?

information_cutoff:
  rating_seasons: [2021, 2022, 2023, 2024, 2025, 2026]
  evaluated_rating_seasons: [2021, 2022, 2023, 2024, 2025]
  test_seasons: [2022, 2023, 2024, 2025, 2026]
  training_rule: window_end strictly before rating_season
  final_unscored_rating_season: 2026
  season_2027: forbidden

selection_source:
  artifact: five_year_spm_feature_audit_v1_4172cf5408
  rule: >-
    For each side, exclude Box15. Keep fields with positive weighted-RMSE
    permutation importance in at least four of five chronological folds, then
    take the five largest mean increases. Defense happened to be positive in
    all five folds for every selected field.

features:
  offense:
    - lost_ball_turnovers_p100
    - long_mid_frequency_eb
    - drive_fta_per_drive_eb
    - short_mid_fga_p100
    - drive_turnovers_p100
  defense:
    - assist_points_created_p100
    - touches_p100
    - dreb_chances_p100
    - recovered_blocks_p100
    - paint_touches_p100

candidates:
  - box_15
  - box_plus_top_offense
  - box_plus_top_defense
  - box_plus_top_both

learner:
  family: ridge
  sample_weight: sqrt_min_offensive_and_defensive_possessions
  alpha_grid: [10, 30, 100, 300, 1000, 3000]
  alpha_selection: leave_one_training_season_out_inside_each_outer_fold

fixed_aio:
  likelihood_seasons: 1
  lambda_offense: 3000
  lambda_defense: 3000
  lambda_home: 300
  center_scale: 1

primary_evaluation:
  metric: equal_season_mean_next_season_game_margin_mse
  readable_metric: rmse
  comparison: identical_games_and_actual_margins
  uncertainty: 5000_paired_whole_game_bootstrap_draws_within_test_season
  correlation_guard: no_more_than_0.01_below_box_15_aio

decision_rule: >-
  Replace Box15 only if a challenger has lower point MSE, a paired 95 percent
  interval below zero versus Box15, and passes the correlation guard. This
  reused diagnostic cannot promote a public model.

forbidden_interpretation: >-
  This reused diagnostic cannot establish causal feature value, independent
  confirmation, or permission to consume Season 2027.
