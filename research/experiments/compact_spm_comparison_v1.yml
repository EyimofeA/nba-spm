schema_version: experiment_preregistration_v1
experiment_id: compact_spm_comparison_v1
status: frozen_reused_diagnostic
created_at: 2026-08-31
estimand_id: prior_validation_suite_v1

question: >-
  Does removing audited within-side feature pairs with absolute correlation at
  least .95 improve the corrected five-year SPM or its one-season RAPM update?

information_cutoff:
  rating_seasons: [2021, 2022, 2023, 2024, 2025, 2026]
  evaluated_rating_seasons: [2021, 2022, 2023, 2024, 2025]
  test_seasons: [2022, 2023, 2024, 2025, 2026]
  training_rule: window_end strictly before rating_season
  final_current_rating_season: 2026

feature_arms:
  full_spm: corrected 128-offense and 72-defense contract
  compact_spm: compact_spm_correlated_v1
  box_pipm: fixed BoxPIPM-style box rates

model_contract:
  target: zero-prior terminal-lineup RAPM over the same rolling five seasons
  rich_offense_learner: frozen histogram gradient boosting
  rich_defense_learner: frozen ridge
  box_learner: ridge with rolling-origin alpha selection on earlier window ends
  sample_weight: square root of the smaller five-year offensive or defensive exposure
  net_identity: offense plus defense

aio_contract:
  likelihood_seasons: 1
  lambda_offense: 3000
  lambda_defense: 3000
  lambda_home: 300
  center_scale: 1
  lineup_policy: terminal

evaluation:
  primary: equal-season mean next-season whole-game margin MSE
  secondary:
    - next-season game-margin correlation
    - five-year RAPM target RMSE and correlation
    - calibration slope
    - paired whole-game MSE interval
  identical_games: required within each test season
  uncertainty:
    draws: 5000
    unit: whole game within test season
    seed: 20260831

decision_rule: >-
  Prefer compact SPM only if its AIO lowers paired next-season MSE against full
  SPM without a material correlation decline. Treat every result as reused
  diagnostic evidence.

stopping_rules:
  - Do not search subsets after seeing these results.
  - Keep learners, sample weights, RAPM penalties, and games fixed.
  - Build the current rating but do not score an unavailable future season.
