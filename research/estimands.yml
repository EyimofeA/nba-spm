schema_version: estimand_registry_v1
updated_at: 2026-08-25
flagship_estimand_id: annual_retrospective_impact_v1

estimands:
  - estimand_id: prior_validation_suite_v1
    name: Frozen statistical-prior validation suite
    status: reused_historical_diagnostic
    unit: test_specific_then_within_fold_percentile_rank
    population: NBA regular-season players and games in the declared historical folds
    window_definition: same-season, adjacent-season, midseason, and next-season tests defined in the frozen experiment contract
    information_cutoff_rule: each rating or prior is frozen before the scored period; Season 2027 is excluded
    target_definition: separate annual normal-RAPM correlations and whole-game margin errors, summarized only through within-fold ranks
    intended_use: compare frozen statistical priors across current-impact and future-game diagnostics
    forbidden_interpretation: ground-truth player value, deployable roster forecast, independent confirmation, or promotion from the composite alone

  - estimand_id: annual_retrospective_impact_v1
    name: Retrospective single-season player impact
    status: provisional_public_flagship
    unit: points_per_100_possessions
    population: NBA regular-season players
    window_definition: one complete regular season
    information_cutoff_rule: complete-season possessions and observed lineups
    target_definition: lineup-adjusted team point differential attributed to players
    intended_use: describe impact during the named season
    forbidden_interpretation: current latent ability, next-season forecast, or causal player value

  - estimand_id: trailing_observed_lineup_rapm_v1
    name: Trailing-window observed-lineup RAPM
    status: production_reference_method
    unit: points_per_100_possessions
    population: NBA regular-season players in the stated trailing window
    window_definition: explicit trailing seasons or dates
    information_cutoff_rule: observed possessions and terminal lineups through the stated date
    target_definition: lineup-adjusted scoring in the observed window
    intended_use: descriptive RAPM evidence and current-data monitoring
    forbidden_interpretation: latent current strength or deployable forecast

  - estimand_id: current_latent_strength_v1
    name: Current latent player strength
    status: research_challenger
    unit: points_per_100_possessions
    population: active NBA players at an explicit date
    window_definition: five trailing regular seasons with exponential possession weighting selected on development seasons
    information_cutoff_rule: only possessions, terminal lineups, and cross-fitted next-season SPM predictions available before the rated season
    target_definition: two-year-half-life RAPM centered on a raw predictive-SPM prior, with offense and defense estimated jointly
    intended_use: research comparison of current player strength and future-game margin prediction
    forbidden_interpretation: retrospective season impact, public production rating, roster-only forecast, causal player value, or confirmed current ability

  - estimand_id: current_player_skill_v1
    name: Current underlying player skill
    status: research_current_skill
    unit: skill_specific
    population: active NBA players with at least one registered skill source through the named date
    window_definition: career or exponentially decayed annual observations with skill-specific empirical-Bayes shrinkage
    information_cutoff_rule: parameters selected on future-season folds through 2024, centers and age residuals refit through 2025, and 2026 observations used only for the current update and reused diagnostic
    target_definition: frozen preseason skill estimate, including a selected age residual where applicable, updated by named-season source observations and kept separate from player impact
    intended_use: current player skill display, season trajectories, and skill-model research
    forbidden_interpretation: RAPM, SPM, AIO impact, causal player credit, playing-time forecast, or untouched 2026 confirmation

  - estimand_id: filtered_time_decayed_normal_rapm_proxy_v1
    name: Filtered time-decayed normal-RAPM trajectory
    status: research_baseline
    unit: points_per_100_possessions
    population: players with an annual normal-RAPM observation in the named season
    window_definition: named season plus exponentially decayed earlier observed player-seasons
    information_cutoff_rule: only annual normal-RAPM estimates through the named season
    target_definition: exposure-weighted filtered average of current and earlier annual normal-RAPM observations
    intended_use: current-strength research and non-interpolated trajectory display
    forbidden_interpretation: fully estimated latent ability, retrospective annual impact, causal player value, or forecast certainty

  - estimand_id: next_season_strength_forecast_v1
    name: Next-season player-strength forecast
    status: not_implemented
    unit: points_per_100_possessions
    population: players eligible for the forecast season
    window_definition: forecast horizon stated in the artifact
    information_cutoff_rule: no information after the forecast date
    target_definition: next-season player impact under a frozen target construction
    intended_use: future team and player prediction
    forbidden_interpretation: same-season descriptive rating

  - estimand_id: playoff_possession_value_v1
    name: Playoff possession value
    status: not_implemented
    unit: points_per_100_possessions
    population: NBA playoff players and possessions
    window_definition: stated postseason or held-out playoff seasons
    information_cutoff_rule: explicit retrospective or pre-series cutoff
    target_definition: playoff scoring impact conditional on opponent and lineup context
    intended_use: playoff translation research
    forbidden_interpretation: unshrunk player-specific playoff talent

  - estimand_id: rolling_peak_impact_v1
    name: Rolling observed RAPM peak
    status: research_leaderboard
    unit: points_per_100_possessions
    population: players meeting exposure in every constituent season
    window_definition: fixed three-year or five-year regular-season window
    information_cutoff_rule: complete observed window
    target_definition: maximum eligible rolling normal-RAPM estimate
    intended_use: descriptive career and peak research
    forbidden_interpretation: uncertainty-corrected true peak or forecast ability

  - estimand_id: post_action_home_win_probability_v1
    name: Post-action home win probability
    status: frozen_infrastructure_baseline
    unit: probability
    population: nonterminal NBA game states
    window_definition: one game state after a completed action
    information_cutoff_rule: state and pregame inputs available at that action
    target_definition: probability that the home team wins the game
    intended_use: calibrated game-state probability and later credit research
    forbidden_interpretation: player credit, causal action value, or pregame forecast by itself

  - estimand_id: expected_possession_residual_rapm_v1
    name: Expected-possession residual RAPM
    status: data_contract_ready
    unit: residual_points_per_100_possessions
    population: canonical NBA possessions with a causally reconstructed start state
    window_definition: explicit regular-season or chronological evaluation sample
    information_cutoff_rule: only player-neutral information known before the possession begins
    target_definition: terminal-lineup RAPM fit to out-of-fold actual minus expected possession points
    intended_use: context-residual RAPM research against normal RAPM on identical games
    forbidden_interpretation: optical-tracking EPV, player-aware expected points, causal player value, or production rating before validation

  - estimand_id: luck_adjusted_player_impact_v1
    name: Conversion-adjusted retrospective player impact
    status: research_null
    unit: points_per_100_possessions
    population: NBA regular-season players with terminal-lineup and shot-event coverage
    window_definition: explicit complete seasons with whole-game-out or prior-season shot expectations
    information_cutoff_rule: current game excluded from shot expectation; player shooting skill estimated only from seasons before the adjusted season
    target_definition: normal points RAPM compared with opponent, teammate-and-opponent, and player-neutral expected-conversion variants
    intended_use: test whether removing estimated shot-conversion residual improves future RAPM or future-game prediction
    forbidden_interpretation: production RAPM, causal shooting credit, causal defense, primary-defender value, or validated luck-adjusted SPM

  - estimand_id: player_neutral_expected_possession_points_v1
    name: Player-neutral expected possession points
    status: research_null
    unit: expected_points_per_possession
    population: canonical NBA regular-season possessions with a causally reconstructed start state
    window_definition: chronological whole-season cross-fit
    information_cutoff_rule: only player-neutral information known before the possession begins
    target_definition: cross-fitted expected points from period, time, score, home side, and prior-possession state
    intended_use: test whether start-state context materially supports a later residual-RAPM challenger
    forbidden_interpretation: optical-tracking EPV, player/team/lineup effect, player value, or residual-RAPM result

  - estimand_id: matchup_defense_observational_v1
    name: Observational matchup-defense residual
    status: research_only
    unit: points_saved_per_100_assigned_matchup_possessions
    population: defenders with licensed matchup coverage
    window_definition: one regular season
    information_cutoff_rule: complete-season matchup aggregates
    target_definition: scorer-adjusted empirical-Bayes matchup scoring residual
    intended_use: defense research and diagnostics
    forbidden_interpretation: causal defensive responsibility or additive total defense

  - estimand_id: observed_lineup_shot_defense_v1
    name: Observed-lineup shot-defense association
    status: research_null
    unit: conditional_shot_probability
    population: NBA regular-season field-goal attempts with exact ordinal lineups
    window_definition: explicit complete regular-season sample
    information_cutoff_rule: shot context, zone, and on-court lineup known at the shot event
    target_definition: shot-zone mix and make probability associated with the observed defensive unit
    intended_use: shot-defense data QA and model-feasibility research
    forbidden_interpretation: primary-defender impact, causal player defense, possession defense, or additive five-player credit

  - estimand_id: rubberband_scoring_context_v1
    name: Pre-possession score-margin scoring adjustment
    status: research_only
    unit: points_per_100_possessions
    population: canonical NBA regular-season regulation possessions with exact terminal lineups and actual game clock
    window_definition: 2024 development, 2025 selection, and reused 2026 diagnostic
    information_cutoff_rule: score, actual game clock, home side, and observed lineup known before the possession begins
    target_definition: expected out-of-fold lineup-residual points associated with offense score margin and game time
    intended_use: estimate a descriptive rubber-band scoring adjustment for a preregistered RAPM target-correction test
    forbidden_interpretation: causal effort, garbage-time truth, player impact, or a promoted RAPM adjustment

  - estimand_id: rubberband_adjusted_rapm_v1
    name: Score-context-normalized retrospective RAPM
    status: research_null
    unit: points_per_100_possessions
    population: canonical NBA regular-season terminal-lineup possessions from 2024 through 2026
    window_definition: fit score curves and player coefficients on 2024 through 2025, evaluate on reused 2026, then refit the descriptive leaderboard on 2024 through 2026
    information_cutoff_rule: player lineups, home side, score margin, actual clock, and fixed pre-possession progress count are known before each possession
    target_definition: observed points minus the fitted time-specific signed-margin slope term, with time-segment intercepts excluded
    intended_use: compare actual-clock and fixed-possession-progress rubber-band normalization with zero-prior RAPM on identical games
    forbidden_interpretation: causal effort, garbage-time truth, forecast, production rating, or proof that score-context normalization improves player measurement

  - estimand_id: joint_clock_score_context_rapm_v1
    name: Joint actual-clock score-context RAPM
    status: research_only
    unit: points_per_100_possessions
    population: canonical NBA regular-season terminal-lineup possessions from 2024 through 2026
    window_definition: select context shrinkage on 2025, evaluate on reused 2026, then refit a descriptive 2024 through 2026 leaderboard
    information_cutoff_rule: terminal lineups, home side, pre-possession score margin, and actual possession-start clock
    target_definition: unchanged possession points with eight actual-clock signed-margin columns fitted jointly beside player and home columns
    intended_use: test whether direct score-context encoding improves neutral player RAPM on identical held-out games
    forbidden_interpretation: causal effort, garbage-time truth, pregame forecast, production rating, or untouched confirmation

  - estimand_id: joint_score_signal_rapm_v1
    name: Joint score-signal RAPM
    status: research_only
    unit: points_per_100_possessions
    population: NBA regular-season terminal-lineup possessions in a five-season trailing window
    window_definition: fit 2020 through 2024 and select on 2025; refit 2021 through 2025 and diagnose on reused 2026
    information_cutoff_rule: terminal lineups, home side, and pre-possession offense score margin
    target_definition: unchanged possession points with categorical, clipped-linear, or training-only spline score-state columns fitted jointly beside players and home
    intended_use: compare modern score-state encodings by neutral next-season game prediction
    forbidden_interpretation: causal effort, garbage-time truth, pregame forecast, production rating, or untouched confirmation

  - estimand_id: joint_age_score_context_rapm_v1
    name: Joint age and score-context RAPM
    status: research_null
    unit: points_per_100_possessions
    population: NBA regular-season terminal-lineup possessions in a five-season trailing window
    window_definition: fit 2020 through 2024 and select on 2025; refit 2021 through 2025 and diagnose on reused 2026
    information_cutoff_rule: terminal lineups, player ages, home side, and pre-possession offense score margin
    target_definition: unchanged possession points with smooth offense and defense lineup-age columns and selected score-state columns fitted jointly beside players and home
    intended_use: compare no adjustment, age only, score only, and age plus score under identical blocked evaluation
    forbidden_interpretation: causal aging, causal effort, garbage-time truth, production rating, or untouched confirmation

  - estimand_id: same_age_long_window_rapm_v1
    name: Same-age long-window RAPM
    status: research_only
    unit: points_per_100_possessions
    population: NBA regular-season players observed from 2014 through 2026
    window_definition: pooled 2014 through 2026 regular seasons
    information_cutoff_rule: terminal lineups, possession points, home side, and player age in the named season
    target_definition: player offense and defense coefficients after jointly controlling for categorical lineup ages, standardized to age 27
    intended_use: diagnose age composition in long-window RAPM and inspect a same-age counterfactual leaderboard
    forbidden_interpretation: single-season impact, biological aging causality, career ranking, current ability, or forecast

  - estimand_id: factor_rapm_reconstruction_ts_v2
    name: TS factor RAPM reconstruction of annual points RAPM
    status: research_only
    unit: points_per_100_possessions
    population: qualified NBA player-seasons from 2024 through 2026
    window_definition: annual factor and points RAPM, with chronological cross-season mapping
    information_cutoff_rule: 2024 development, 2025 selection, and reused 2026 diagnostics; Season 2027 untouched
    target_definition: annual offense and defense points RAPM estimated from annual true-shooting, turnover, and offensive-rebound RAPMs
    intended_use: test whether opportunity-specific factor RAPMs reconstruct ordinary points RAPM across seasons
    forbidden_interpretation: causal factor credit, independent validation, future forecast, or production player rating

  - estimand_id: factor_target_sparse_spm_v1
    name: Sparse statistical models of annual factor RAPM
    status: research_only
    unit: factor_rating_then_points_per_100_possessions
    population: qualified NBA player-seasons from 2024 through 2026
    window_definition: same-season features and annual factor targets, with 2024 development, 2025 selection, and reused 2026 diagnostics
    information_cutoff_rule: only the named season's player statistics and leave-one-player-out recorded-team context; Season 2027 untouched
    target_definition: separate offense and defense shooting-TS, turnover, and offensive-rebound RAPMs, followed by a learned side-specific map into ordinary points RAPM
    intended_use: test whether small related feature sets estimate factor RAPM and whether teammate context improves that estimate
    forbidden_interpretation: causal factor credit, teammate skill, independent validation, future forecast, production rating, or untouched confirmation

  - estimand_id: factor_target_full_feature_spm_v1
    name: Full-feature statistical ceiling for annual factor RAPM
    status: research_only
    unit: factor_rating_then_points_per_100_possessions
    population: qualified NBA player-seasons from 2024 through 2026
    window_definition: same-season full SPM feature banks and annual factor targets, with 2024 development, 2025 selection, and reused 2026 diagnostics
    information_cutoff_rule: only named-season player statistics and leave-one-player-out recorded-team context; Season 2027 untouched
    target_definition: separate offense and defense shooting-TS, turnover, and offensive-rebound RAPMs, followed by a learned side-specific map into ordinary points RAPM
    intended_use: measure how much the full available statistical feature bank can recover each factor target and ordinary points RAPM
    forbidden_interpretation: production rating, complete defense ceiling, causal factor credit, causal teammate effect, future forecast, or untouched confirmation

  - estimand_id: five_year_spm_teammate_context_v1
    name: Teammate-context correction to five-year SPM
    status: research_challenger
    unit: points_per_100_possessions
    population: players with frozen five-year SPM predictions ending from 2021 through 2026
    window_definition: five annual leave-one-player-out teammate contexts pooled over the identical trailing five seasons as the SPM rating
    information_cutoff_rule: for rating season t, residual correction trains only on stored SPM predictions and targets ending before t; Season 2027 untouched
    target_definition: frozen five-year SPM plus a side-specific ridge estimate of remaining five-year RAPM error from teammate context
    intended_use: test whether team-context statistics add incremental same-window and next-season signal to the research SPM
    forbidden_interpretation: player skill, causal teammate value, production rating, independent confirmation, or complete defense ceiling
